summary: "Self-taught platform engineer designing and operating infrastructure, AI/ML and developer experience platforms. Multi-language stack (Python, Ruby, Perl, PHP, C/C++, Java, R, Prolog, VimScript)."

bio: |
  Born in 1984. The fascination started before any keyboard. TV commercials
  for home computers, the director's machine at nursery school glimpsed
  through a half-open door, NES and MasterSystem controllers at friends'
  houses: the screens were already there, doing things, long before I knew
  how to make them do anything I wanted.

  First actual contact came around 1990-91 at primary school: Thomson
  TO7/MO5 units, the "Informatique pour Tous" plan, mostly sticking tape on
  the keyboards rather than shipping code, but BASIC snuck in anyway.

  The real thing came a year or two later. My father brought home a VTech
  Laser 500: cassette deck, fifteen-minute load times, a Scheidegger BASIC
  course in a grey briefcase. My first machine. Still have it. Between eight
  and ten years old I wrote agenda apps, calculators, text games, fractal
  generators, all in BASIC, none of it useful, all of it mine.

  1993, age nine: DOOM on a 486DX2/66 with 4 MB RAM and a Sound Blaster, at
  school, because at home I still had the Laser 500. That demo rewired
  something permanently. A machine building 3D worlds in real time. Game over
  for every other hobby.

  1994, age ten: my aunt passed me her Amstrad CPC 6128+ with Locomotive
  BASIC, CP/M, a 3-inch floppy drive, and a stack of listing books riddled
  with publisher typos. You typed pages of code, hit RUN, got a syntax error
  on line 340, and debugged it for hours. That was the curriculum. No Stack
  Overflow. No forums. Just the listing and the machine.

  Around 1995-96, while everyone else was on PlayStation, I was on
  Super Nintendo with an Action Replay 2. Not to cheat, or not only: to
  understand what the codes actually did, which memory addresses they
  patched, what happened when you changed a byte. Freeze the game, inspect
  the value, modify it, see what broke. That was the first real taste of
  reverse engineering, before I had a word for it, before I had a PC, before
  I had x86 assembly. Just a cartridge, a code device, and a question.

  1996-97: first personal PC, Pentium then AMD K6. Warcraft 1 and 2, C, x86
  assembly, Quake, Quake 2. BBS and newsgroups slowly dissolving into the
  web. The Action Replay habit followed onto PlayStation and then the PC:
  same instinct, better tools. 1998: StarCraft and Brood War, three
  perfectly balanced races, entire nights of micro-management. 1999: Quake
  3, Unreal Tournament, Counter-Strike on the Half-Life engine, the tactical
  FPS online, invented in a garage. 2000: organized CS with a clan, LAN
  parties, Linux install parties, then PHP, Python, Ruby.

  Post-2001: the MMO era hit hard. T4C (The 4th Coming), then DAoC, nights
  of farming and PvP in persistent worlds that kept turning when you logged
  off. No WoW yet, but the addiction was already wired in.

  2007-2008: a second track started quietly alongside the gaming. A Perl
  harness strapped to GDB, automating the tedious parts of exploit
  development: fuzz the offset, resolve the JMP ESP gadget, build the
  payload, fire. Stack overflows, format strings, ret2libc, each technique
  abstracted behind a common interface. Not impressive by any standard.
  At the time, watching it land a shell on its own for the first time was
  enough.

  2009: SWI-Prolog replaced the hardcoded if/else dispatch. Target
  properties became facts, exploitation preconditions became rules, and the
  engine could reason about which technique to apply instead of just
  iterating. At the time I was working as a self-taught sysadmin at the
  Universite de Provence, campus Saint-Charles in Marseille, where Alain
  Colmerauer (creator of Prolog, 1972, Luminy, ten minutes away) was
  retired but still around. He talked about his language to a sysadmin
  who did not know what logic programming was. That conversation was enough.

  2010: discovered Metasm, Yoann Guillot's pure-Ruby binary analysis suite,
  via an exploitation tutorial on the Sogeti ESEC lab blog. Where the
  Perl/GDB system orchestrated external tools, Metasm internalized
  everything: assembler, disassembler, debugger interface, ELF/PE parsers,
  all in one library. Learning Ruby through Metasm's codebase opened an
  entire ecosystem: Puppet, Foreman, early GitLab. The exploitation
  framework became an infrastructure career. Funny how that works.

  2009-2012 ran on two tracks simultaneously. One was the WoW server:
  MaNGOS on a VPS, CMake compiles pegging every core, MySQL with accounts
  and quest templates, a launcher, a signup system, game masters, a
  community, all self-taught, zero budget. The other track was the Prolog
  inference engine growing into a genetic algorithm: populations of
  strategy configurations evaluated in parallel via Parallel::ForkManager,
  fitness measured as exploitation success rate, generations converging on
  weight inversions that human intuition had never found. Both tracks ran
  on the same Core 2 Duo, in the same Marseille apartment.

  Post-2012: industrialized deployments of TeamSpeak and Mumble servers,
  Steam game servers for CS:GO and ARK. Ran a cross-server ARK community
  with plugins, synchronized wipes, GM events, and centralized configs. Ops
  at scale, still for fun. In parallel, a separate R/ML track: neural
  networks, predictive models, weather first, then forex and crypto. Same
  pattern as the exploit engine (profile, predict, act, learn), different
  domain.

  Around 2018, Python unified both lines. pwntools for binary profiling,
  z3-solver for numerical constraints, PyTorch replacing R for the models.
  Ruby stayed for the exploitation layer; Python became the orchestrator.
  2019: first contextual bandits (Thompson sampling) replacing the static
  GA weights. 2023: LLM integration (GPT, then Ollama for local inference).

  2024-2026: the architecture settled into six layers (fuzzing, profiling,
  Datalog/Souffle, Bitwuzla/Z3, LLM, bandit/MCTS), validated on three
  public CTF suites (24/24) and a documented kernel exploit chain. Three
  articles written up, describing fifteen years of evolution from a Perl
  script and a Prolog query to a hybrid neuro-symbolic pipeline.

  The machines got bigger, the stack got deeper, the instinct never changed:
  figure it out, build it, run it.

