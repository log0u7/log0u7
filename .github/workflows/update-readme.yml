name: Update README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install figlet
        run: sudo apt-get update && sudo apt-get install -y figlet

      - name: Pre-render banner (fallback)
        run: figlet -f slant "log0u7" > assets/banner.txt || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate README
        run: python generate_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md assets/banner.txt
            git commit -m "chore: update README [skip ci]"
            git push
          else
            echo "No changes to README.md"
          fi
